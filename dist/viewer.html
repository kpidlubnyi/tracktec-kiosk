<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111111">
  <meta name="description" content="Track Tec interactive 3D product viewer"><title>3D viewer · Track Tec</title>
  <script>try{if(localStorage.getItem("tracktec-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
  <main class="kiosk-shell viewer-shell">
    <header class="topbar"><img class="brand-logo tracktec-logo" src="assets/logo/tt-logo-black-og.png" alt="Track Tec"><span></span><div class="topbar-actions"><div class="language-switcher" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="pl" aria-pressed="false">PL</button><button data-lang="de" aria-pressed="false">DE</button></div><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme"><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></header>
    <div class="viewer-title-row"><h1 id="viewerTitle">3D viewer</h1><a id="backProduct" class="back-button" href="tracktec.html" data-preserve-language><span class="back-icon" aria-hidden="true"><span class="arrow-glyph">←</span></span><span data-i18n="backProduct">Back to product</span></a></div>
    <div class="viewer-container" id="viewer3d">
      <div class="canvas-loader" id="viewer-loader"><div class="loader-spinner"></div><span class="loader-text" id="loader-status" data-i18n="loading3d">Loading 3D model…</span></div>
      <div class="viewer-controls" id="viewer-controls" role="toolbar" aria-label="Viewer controls" hidden>
        <button type="button" class="viewer-btn" id="btn-reset" title="Reset view"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span data-i18n="reset">Reset</span></button>
        <button type="button" class="viewer-btn active" id="btn-rotate" title="Auto-rotate"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg><span data-i18n="rotate">Rotate</span></button>
        <button type="button" class="viewer-btn" id="btn-cover" title="Hide outer parts"><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9z"/><path d="M3 7.5 12 12l9-4.5"/><path d="M12 12v9"/></svg><span data-i18n="cover">Cover</span></button>
        <button type="button" class="viewer-btn" id="btn-clip" title="Cross-section slice"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/><path d="M9 15l6-6"/><path d="M15 15l-6-6"/></svg><span data-i18n="slice">Slice</span></button>
        <button type="button" class="viewer-btn" id="btn-wireframe" title="Wireframe"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span data-i18n="wireframe">Wireframe</span></button>
        <button type="button" class="viewer-btn" id="btn-fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span data-i18n="fullscreen">Fullscreen</span></button>
      </div>
      <div class="clip-slider-container" id="clip-slider-container" hidden><div class="clip-axes" id="clip-axes" role="group" aria-label="Slice plane"><button type="button" class="clip-axis active" data-axis="x">X</button><button type="button" class="clip-axis" data-axis="y">Y</button><button type="button" class="clip-axis" data-axis="z">Z</button></div><label for="clip-slider" id="clip-slider-label">PLANE X</label><input type="range" id="clip-slider" min="-1" max="1" step="0.01" value="0"></div>
    </div>
    <footer class="site-footer"><strong>TRACK TEC GROUP</strong><span data-i18n="rights">All rights reserved. This presentation and its original contents are the property of Track Tec.</span></footer>
  </main>
  <script src="js/viewer-shell.js" defer></script><script src="js/i18n.js" defer></script><script type="module" src="js/viewer3d.js"></script>
</body>
</html>

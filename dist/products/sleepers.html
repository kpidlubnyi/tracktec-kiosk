<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#111111">
  <meta name="description" content="Track Tec concrete sleepers"><title>Track Tec — Concrete sleepers</title>
  <script>try{if(localStorage.getItem("tracktec-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="stylesheet" href="../css/styles.css"><script src="../js/i18n.js" defer></script>
</head>
<body>
  <main class="kiosk-shell catalog-shell" id="top">
    <header class="topbar"><img class="brand-logo tracktec-logo" src="../assets/logo/tt-logo-black-og.png" alt="Track Tec"><span></span><div class="topbar-actions"><div class="language-switcher" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="pl" aria-pressed="false">PL</button><button data-lang="de" aria-pressed="false">DE</button></div><button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme"><svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></header>
    <nav class="product-selector" aria-label="Product categories"><a class="selector-button" href="sleepers.html" aria-current="page" data-i18n="sleepers">Sleepers</a><a class="selector-button" href="rail-fastenings.html" data-preserve-language data-i18n="fastenings">Rail fastenings</a><a class="selector-button" href="turnouts.html" data-preserve-language data-i18n="turnouts">Turnouts</a><a class="selector-button" href="level-crossing-panels.html" data-preserve-language data-i18n="crossings">Level crossing panels</a></nav>
    <section class="catalog-heading"><h1 data-copy-en="Concrete sleepers" data-copy-pl="Podkłady betonowe" data-copy-de="Betonschwellen">Concrete sleepers</h1></section>
    <section class="product-list" id="sleeper-list"></section>
    <script>
      (async function () {
        var list = document.getElementById("sleeper-list");
        var escapeHtml = function (value) {
          return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character];
          });
        };

        try {
          var response = await fetch("../data/concrete-sleepers.json", { cache: "no-store" });
          if (!response.ok) throw new Error("HTTP " + response.status);
          var catalog = await response.json();
          list.innerHTML = catalog.products.map(function (product) {
            var viewerUrl = "../viewer.html?cat=" + encodeURIComponent(catalog.slug) + "&item=" + encodeURIComponent(product.id) + "&model=" + encodeURIComponent(product.model3d) + "&return=products/sleepers.html&name=" + encodeURIComponent(product.name);
            var specs = product.specs.rows.map(function (row) {
              var value = row.value + (row.unit ? " " + row.unit : "");
              return '<div class="spec-row"><span class="spec-label" data-copy-en="' + escapeHtml(row.label.en) + '" data-copy-pl="' + escapeHtml(row.label.pl) + '" data-copy-de="' + escapeHtml(row.label.de) + '">' + escapeHtml(row.label.en) + '</span><span class="spec-value">' + escapeHtml(value) + '</span></div>';
            }).join("");
            return '<article class="product-detail"><div class="product-media"><img src="../' + escapeHtml(product.image) + '" alt="' + escapeHtml(product.name) + '"><a class="model-button" href="' + escapeHtml(viewerUrl) + '" data-preserve-language><svg viewBox="0 0 24 24"><path d="M12 2.5 20 7v10l-8 4.5L4 17V7z"/><path d="M12 2.5V12m0 9.5V12M4 7l8 5 8-5"/></svg><span data-i18n="view3d">View 3D model</span><span class="round-arrow" aria-hidden="true"><span class="arrow-glyph">→</span></span></a></div><div class="product-copy"><h2>' + escapeHtml(product.name) + '</h2><p data-copy-en="' + escapeHtml(product.text.en) + '" data-copy-pl="' + escapeHtml(product.text.pl) + '" data-copy-de="' + escapeHtml(product.text.de) + '">' + escapeHtml(product.text.en) + '</p><div class="product-specs">' + specs + '</div></div></article>';
          }).join("");

          if (document.readyState !== "loading") {
            var queryLanguage = new URLSearchParams(window.location.search).get("lang");
            var savedLanguage = localStorage.getItem("tracktec-language");
            setLanguage(queryLanguage || savedLanguage || "en");
            setupProductReturnPosition();
            setupProductScrollReveal(list);
          }
        } catch (error) {
          console.error("Unable to load sleeper catalog", error);
          list.innerHTML = '<p class="catalog-load-error">Unable to load sleeper product data.</p>';
        }
      }());
    </script>
    <nav class="catalog-navigation" aria-label="Category navigation"><span class="catalog-nav-start"><a class="nav-arrow" href="level-crossing-panels.html" data-preserve-language><span class="back-icon" aria-hidden="true"><span class="arrow-glyph">←</span></span><span data-i18n="previous">Previous</span></a><a class="nav-arrow" href="#top"><span class="back-icon" aria-hidden="true"><span class="arrow-glyph">↑</span></span><span data-i18n="top">Top</span></a></span><a class="back-button" href="../tracktec.html" data-preserve-language><span class="back-icon" aria-hidden="true"><span class="arrow-glyph">←</span></span><span data-i18n="categories">Product categories</span></a><a class="nav-arrow next" href="rail-fastenings.html" data-preserve-language><span data-i18n="next">Next</span><span class="round-arrow" aria-hidden="true"><span class="arrow-glyph">→</span></span></a></nav>
    <footer class="site-footer"><strong>TRACK TEC GROUP</strong><span data-i18n="rights">All rights reserved. This presentation and its original contents are the property of Track Tec.</span></footer>
  </main>
</body>
</html>

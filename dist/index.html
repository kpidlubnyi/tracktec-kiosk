<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Track Tec Group interactive product presentation">
  <title>Track Tec Group</title>
  <script>try{if(localStorage.getItem("tracktec-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0e'/%3E%3Cpath d='M6 10h20M8 16h16M10 22h12' stroke='%23dfe1e2' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/i18n.js" defer></script>
</head>
<body>
  <div class="page-tools">
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme">
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="hidden-tools-menu" data-hidden-tools hidden>
      <button type="button" data-change-logo>Change logo</button>
      <button type="button" data-close-hidden-tools>Close</button>
    </div>
  </div>
  <main class="kiosk-shell home-shell">
    <section class="brand-selector" aria-label="Choose a company">
      <div class="brand-choice">
        <img class="brand-logo tracktec-logo" src="assets/logo/tt-logo-black-og.png" alt="Track Tec">
        <a class="select-button" href="tracktec.html">Select</a>
      </div>
      <div class="brand-divider" aria-hidden="true"></div>
      <div class="brand-choice">
        <img class="brand-logo tines-logo" src="assets/logo/tines-logo.png" alt="TINES">
        <a class="select-button" href="http://localhost:5173/tines-kiosk/">Select</a>
      </div>
    </section>

    <section class="showcase-strip" aria-label="Product highlights">
      <a class="showcase-card" href="products/sleepers.html" aria-label="Track Tec sleepers"><img src="assets/products/sleepers.png" alt="Railway sleeper"></a>
      <a class="showcase-card" href="products/rail-fastenings.html" aria-label="Track Tec rail fastenings"><img src="assets/products/rail-fastenings.png" alt="Rail fastening"></a>
      <a class="showcase-card" href="products/turnouts.html" aria-label="Track Tec turnouts"><img src="assets/products/turnouts.png" alt="Railway turnout"></a>
      <a class="showcase-card" href="http://localhost:5173/tines-kiosk/" aria-label="TINES level crossing panels"><img src="assets/products/main-level-crossing-panels.png" alt="Level crossing panel"></a>
      <a class="showcase-card" href="http://localhost:5173/tines-kiosk/" aria-label="TINES cable systems"><img src="assets/products/cable-systems.png" alt="Cable system"></a>
    </section>

    <footer class="site-footer">
      <strong>TRACK TEC GROUP</strong>
      <span>All rights reserved. This presentation and its original contents are the property of Track Tec.</span>
    </footer>
  </main>
  <script>
    (function () {
      var holdDuration = 3000;
      var themeButton = document.querySelector(".page-tools [data-theme-toggle]");
      var menu = document.querySelector("[data-hidden-tools]");
      var logo = document.querySelector(".brand-choice .tracktec-logo");
      var changeLogo = document.querySelector("[data-change-logo]");
      var closeMenu = document.querySelector("[data-close-hidden-tools]");
      var holdTimer = 0;
      var suppressClick = false;
      var defaultLogo = "assets/logo/tt-logo-black-og.png";
      var alternateLogo = "assets/logo/tt-logo.png";
      var alternateLogoActive = false;

      if (!themeButton || !menu || !logo) return;

      try {
        alternateLogoActive = localStorage.getItem("tracktec-logo-variant") === "standard";
        if (alternateLogoActive) {
          logo.src = alternateLogo;
        }
      } catch (error) { /* storage is optional */ }
      logo.classList.toggle("black-logo-active", !alternateLogoActive);

      function cancelHold() {
        if (holdTimer) window.clearTimeout(holdTimer);
        holdTimer = 0;
        themeButton.classList.remove("is-holding");
      }

      function beginHold(event) {
        if (event.button !== undefined && event.button !== 0) return;
        cancelHold();
        themeButton.classList.add("is-holding");
        holdTimer = window.setTimeout(function () {
          holdTimer = 0;
          suppressClick = true;
          themeButton.classList.remove("is-holding");
          menu.hidden = false;
          menu.querySelector("button").focus({ preventScroll: true });
        }, holdDuration);
      }

      themeButton.addEventListener("pointerdown", beginHold);
      themeButton.addEventListener("pointerup", cancelHold);
      themeButton.addEventListener("pointercancel", cancelHold);
      themeButton.addEventListener("pointerleave", cancelHold);
      themeButton.addEventListener("click", function (event) {
        if (!suppressClick) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        suppressClick = false;
      }, true);

      changeLogo.addEventListener("click", function () {
        alternateLogoActive = !alternateLogoActive;
        logo.src = alternateLogoActive ? alternateLogo : defaultLogo;
        logo.classList.toggle("black-logo-active", !alternateLogoActive);
        logo.alt = "Track Tec";
        try {
          localStorage.setItem("tracktec-logo-variant", alternateLogoActive ? "standard" : "black");
        } catch (error) { /* storage is optional */ }
      });
      closeMenu.addEventListener("click", function () {
        menu.hidden = true;
        themeButton.focus({ preventScroll: true });
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !menu.hidden) closeMenu.click();
      });
    }());
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Explore Track Tec railway solutions">
  <title>Track Tec — Solutions</title>
  <script>try{if(localStorage.getItem("tracktec-theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0e'/%3E%3Cpath d='M6 10h20M8 16h16M10 22h12' stroke='%23dfe1e2' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/i18n.js" defer></script>
</head>
<body>
  <main class="kiosk-shell subpage-shell">
    <header class="topbar">
      <img class="brand-logo tracktec-logo" src="assets/logo/tt-logo-black-og.png" alt="Track Tec">
      <div class="intro">
        <h1 data-i18n="explore">Explore our solutions</h1>
        <p data-i18n="tagline">Delivering smart solutions for railways of tomorrow</p>
      </div>
      <div class="topbar-actions">
        <div class="language-switcher" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="pl" aria-pressed="false">PL</button>
          <button type="button" data-lang="de" aria-pressed="false">DE</button>
        </div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme">
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <section class="category-grid" aria-label="Product categories">
      <a class="category-card" href="products/sleepers.html" data-preserve-language>
        <div class="category-image"><img src="assets/products/sleepers.png" alt="Railway sleeper"></div>
        <div class="category-meta"><span class="category-name" data-i18n="sleepers">Sleepers</span><span class="round-arrow" aria-hidden="true"><span class="arrow-glyph">→</span></span></div>
      </a>
      <a class="category-card" href="products/rail-fastenings.html" data-preserve-language>
        <div class="category-image"><img src="assets/products/rail-fastenings.png" alt="Rail fastening"></div>
        <div class="category-meta"><span class="category-name" data-i18n="fastenings">Rail fastenings</span><span class="round-arrow" aria-hidden="true"><span class="arrow-glyph">→</span></span></div>
      </a>
      <a class="category-card" href="products/turnouts.html" data-preserve-language>
        <div class="category-image"><img src="assets/products/turnouts.png" alt="Railway turnout"></div>
        <div class="category-meta"><span class="category-name" data-i18n="turnouts">Turnouts</span><span class="round-arrow" aria-hidden="true"><span class="arrow-glyph">→</span></span></div>
      </a>
      <a class="category-card" href="products/level-crossing-panels.html" data-preserve-language>
        <div class="category-image"><img src="assets/products/level-crossing-panels.png" alt="Level crossing panel"></div>
        <div class="category-meta"><span class="category-name" data-i18n="crossings">Level crossing panels</span><span class="round-arrow" aria-hidden="true"><span class="arrow-glyph">→</span></span></div>
      </a>
    </section>

    <div class="bottom-row">
      <a class="back-button" href="index.html"><span class="back-icon" aria-hidden="true"><span class="arrow-glyph">←</span></span><span data-i18n="back">Back</span></a>
      <footer class="site-footer"><strong>TRACK TEC GROUP</strong><span data-i18n="rights">All rights reserved. This presentation and its original contents are the property of Track Tec.</span></footer>
      <span aria-hidden="true"></span>
    </div>

</html>
